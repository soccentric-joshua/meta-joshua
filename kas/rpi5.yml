header:
  version: 14

distro: poky
machine: raspberrypi5
target: joshua-image

repos:
  poky:
    url: https://git.yoctoproject.org/poky
    commit: 6b7474f7ca29076d28df81a49feec6311fa18202
    path: layers/poky
    layers:
      meta:
      meta-poky:
      meta-yocto-bsp:
  meta-openembedded:
    url: https://github.com/openembedded/meta-openembedded.git
    commit: 29a044218285fdc7fcdd63d5f0929cb3a27b6fed
    path: layers/meta-openembedded
    layers:
      meta-oe:
      meta-networking:
      meta-python:
      meta-multimedia:
  meta-raspberrypi:
    url: https://github.com/agherzan/meta-raspberrypi.git
    commit: 6ca1f75017cc5d5acdb8bb05634c4bc01fa049fd
    path: layers/meta-raspberrypi
    layers:
      .:
  meta-swupdate:
    url: https://github.com/sbabic/meta-swupdate.git
    commit: 438e8ea2d98aa5fd5f571f84db154dbe9062b37a
    path: layers/meta-swupdate
    layers:
      .:
  meta-joshua:
    layers:
      .:

local_conf_header:
  joshua: |
    INIT_MANAGER = "systemd"
    IMAGE_FSTYPES = "wic.bz2 wic.bmap ext4"
    WKS_FILE = "sdimage-rpi5.wks"
    DL_DIR = "/downloads"
    SSTATE_DIR = "/sstate"
    PACKAGECONFIG:append:pn-swupdate = " webserver"
    SWUPDATE_INIT = "systemd"
    SWUPDATE_SECURE_MODE ?= "0"
    BBMASK += ".*recipes-bsp/acadia-hal.*|.*recipes-connectivity/acadia-client.*"
    ENABLE_UART = "1"
    SERIAL_CONSOLES = "115200;ttyAMA10"
    DISTRO_FEATURES:append = " ptest"
    EXTRA_IMAGE_FEATURES:append = " tools-debug tools-sdk ptest-pkgs"
    SDKIMAGE_FEATURES:append = " staticdev-pkgs dbg-pkgs src-pkgs ptest-pkgs"
    TOOLCHAIN_TARGET_TASK:append = " gdbserver perf trace-cmd valgrind ptest-runner"